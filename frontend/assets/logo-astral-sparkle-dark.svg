<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 60" width="100%" height="100%">
  <!-- 
    CONCEPT: "The Astral Starburst" (Dark Mode Variant)
    Purely abstract luxury mark optimized for dark backgrounds and GitHub dark theme.
  -->

  <!-- ICON SECTION -->
  <g transform="translate(10, 0)">
    <!-- The Orbital Ring (Silver platinum) -->
    <circle cx="30" cy="30" r="16" fill="none" stroke="#888888" stroke-width="0.75" />
    
    <!-- The Diagonal Secondary Sparkle (Soft Frosted Silver) -->
    <path d="M 30 14 Q 30 26 42 30 Q 30 34 30 46 Q 30 34 18 30 Q 30 26 30 14 Z" 
          fill="#B0B0B0" 
          transform="rotate(45 30 30)" />
          
    <!-- The Primary Vertical/Horizontal Sparkle (Pure Luminous White) -->
    <path d="M 30 4 Q 30 26 50 30 Q 30 34 30 56 Q 30 34 10 30 Q 30 26 30 4 Z" 
          fill="#FFFFFF" />
          
    <!-- The Core Void -->
    <circle cx="30" cy="30" r="1.5" fill="#121212" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <text x="80" y="34" 
        font-family="'Didot', 'Playfair Display', 'Bodoni MT', 'Times New Roman', serif" 
        font-size="22" 
        font-weight="500" 
        fill="#FFFFFF" 
        letter-spacing="4">
    SAJIYA'S SPARKLE
  </text>
  
  <text x="82" y="48" 
        font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" 
        font-size="8" 
        font-weight="400" 
        fill="#A3A3A3" 
        letter-spacing="9">
    FINE JEWELLERY
  </text>

</svg>
